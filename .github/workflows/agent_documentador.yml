name: Agente documentador

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'  # Lunes 9:00 AM

jobs:
  documentador:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Revisar documentación con Gemini
        id: revisar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          README=$(cat README.md 2>/dev/null || echo "No existe")
          CHANGELOG=$(cat CHANGELOG.md 2>/dev/null || echo "No existe")
          
          PROMPT="Eres un agente revisor de documentación para un proyecto de simulación N-cuerpos en C++/CUDA (Lab 2, USACH).
          Revisa los siguientes documentos y detecta problemas concretos:
          - Secciones faltantes obligatorias según el enunciado
          - Referencias a GPU/CUDA faltantes en README
          - CHANGELOG desactualizado (sin entradas de Lab 2)
          - Links rotos o secciones vacías

          README.md:
          $README

          CHANGELOG.md:
          $CHANGELOG

          Responde en formato JSON exacto con la estructura:
          {
            \"problemas\": [
              {
                \"tipo\": \"mecanico\" o \"requiere_humano\",
                \"archivo\": \"nombre del archivo\",
                \"descripcion\": \"descripción corta del problema\",
                \"sugerencia\": \"qué hacer exactamente\"
              }
            ],
            \"resumen\": \"frase corta con el estado general\"
          }"

          # Llamada a la API de Gemini configurando JSON estructurado de salida
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{\"parts\":[{\"text\": $(echo "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}]}],
              \"generationConfig\": {
                \"responseMimeType\": \"application/json\"
              }
            }")

          # Extraer el texto plano del JSON que retorna Gemini
          echo "$RESPONSE" | python3 -c "
          import json, sys
          data = json.loads(sys.stdin.read())
          raw_text = data['candidates'][0]['content']['parts'][0]['text'].strip()
          # Limpieza por si el modelo incluye bloques de código markdown
          if raw_text.startswith('```json'): raw_text = raw_text[7:]
          if raw_text.endswith('```'): raw_text = raw_text[:-3]
          print(raw_text.strip())
          " > analisis.json || echo '{"problemas":[],"resumen":"Error al parsear respuesta"}' > analisis.json

      - name: Crear issues si hay problemas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, subprocess
          with open('analisis.json') as f:
              analisis = json.load(f)
          problemas = analisis.get('problemas', [])
          creados = 0
          for p in problemas:
              if creados >= 3:
                  break
              tipo = p.get('tipo', '')
              desc = p.get('descripcion', '')
              sug = p.get('sugerencia', '')
              archivo = p.get('archivo', '')
              
              if tipo == 'mecanico':
                  labels = 'documentation,agent,agent:auto-fix'
                  body = f"## Problema detectado por agente documentador\n\n**Archivo:** `{archivo}`\n**Tipo:** Mecánico\n\n## Descripción\n{desc}\n\n## Sugerencia\n{sug}"
              else:
                  labels = 'documentation,agent'
                  body = f"## Revisión requerida — agente documentador\n\n**Archivo:** `{archivo}`\n**Tipo:** Requiere intervención humana\n\n## Descripción\n{desc}\n\n**Detalles:** {sug}"
                  
              titulo = f"[Agente] Documentación: {desc[:60]}"
              subprocess.run(['gh', 'issue', 'create', '--title', titulo, '--body', body, '--label', labels])
              creados += 1
          EOF