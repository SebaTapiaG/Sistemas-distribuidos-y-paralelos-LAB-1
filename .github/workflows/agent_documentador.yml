name: Agente documentador

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  documentador:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Revisar documentación con GitHub Models
        id: revisar
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          README=$(cat README.md 2>/dev/null || echo "No existe")
          CHANGELOG=$(cat CHANGELOG.md 2>/dev/null || echo "No existe")
          
          PROMPT="Eres un agente revisor de documentación para un proyecto de simulación N-cuerpos en C++/CUDA (Lab 2, USACH).
          Revisa los siguientes documentos y detecta problemas concretos:
          - Secciones faltantes obligatorias según el enunciado
          - Referencias a GPU/CUDA faltantes en README
          - CHANGELOG desactualizado (sin entradas de Lab 2)
          - Links rotos o secciones vacías

          README.md:
          $README

          CHANGELOG.md:
          $CHANGELOG

          Responde en formato JSON exacto con la estructura:
          {
            \"problemas\": [
              {
                \"tipo\": \"mecanico\" o \"requiere_humano\",
                \"archivo\": \"nombre del archivo\",
                \"descripcion\": \"descripción corta del problema\",
                \"sugerencia\": \"qué hacer exactamente\"
              }
            ],
            \"resumen\": \"frase corta con el estado general\"
          }"

          # Llamada a GitHub Models
          curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are a helpful assistant designed to output JSON.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": $(echo "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
                }
              ],
              \"response_format\": { \"type\": \"json_object\" },
              \"temperature\": 0.1
            }" > api_response.json

          # Procesamiento y Salvavidas
          python3 << 'EOF' > analisis.json
          import json, sys
          try:
              with open('api_response.json', 'r') as f:
                  data = json.load(f)
              
              if 'error' in data:
                  fallback = {
                      "problemas": [],
                      "resumen": f"Error de GitHub Models API: {data['error'].get('message', 'Desconocido')}"
                  }
                  print(json.dumps(fallback))
                  sys.exit(0)
                  
              raw_text = data['choices'][0]['message']['content'].strip()
              
              if raw_text.startswith('```json\n'): raw_text = raw_text[8:]
              elif raw_text.startswith('```json'): raw_text = raw_text[7:]
              if raw_text.endswith('```'): raw_text = raw_text[:-3]
              
              json.loads(raw_text.strip())
              print(raw_text.strip())
              
          except Exception as e:
              fallback = {
                  "problemas": [],
                  "resumen": f"Fallo al procesar respuesta del LLM: {str(e)}"
              }
              print(json.dumps(fallback))
          EOF

      - name: Crear issues si hay problemas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, subprocess
          with open('analisis.json') as f:
              analisis = json.load(f)
          problemas = analisis.get('problemas', [])
          creados = 0
          for p in problemas:
              if creados >= 3:
                  break
              tipo = p.get('tipo', '')
              desc = p.get('descripcion', '')
              sug = p.get('sugerencia', '')
              archivo = p.get('archivo', '')
              
              if tipo == 'mecanico':
                  labels = 'documentation,agent,agent:auto-fix'
                  body = f"## Problema detectado por agente documentador (gpt-4o-mini)\n\n**Archivo:** `{archivo}`\n**Tipo:** Mecánico\n\n## Descripción\n{desc}\n\n## Sugerencia\n{sug}"
              else:
                  labels = 'documentation,agent'
                  body = f"## Revisión requerida — agente documentador (gpt-4o-mini)\n\n**Archivo:** `{archivo}`\n**Tipo:** Requiere intervención humana\n\n## Descripción\n{desc}\n\n**Detalles:** {sug}"
                  
              titulo = f"[Agente] Documentación: {desc[:60]}"
              subprocess.run(['gh', 'issue', 'create', '--title', titulo, '--body', body, '--label', labels])
              creados += 1
          EOF