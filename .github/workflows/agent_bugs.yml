name: Agente revisor de bugs

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  revisor-bugs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Analizar código con GitHub Models
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          # 1. Recopilamos el código de los archivos
          CODIGO=""
          for f in kernels/*.cu kernels/*.cuh CudaBuffer.h NBodySystem.cpp NBodySimulator.cpp; do
            if [ -f "$f" ]; then
              CODIGO="$CODIGO\n\n===$f ===\n$(head -n 80 "$f")"
            fi
          done
          
          if [ -z "$CODIGO" ]; then
            CODIGO="No se encontraron archivos CUDA aún."
          fi
          
          # Guardamos en variable de entorno segura para Python
          export CODIGO_CONTENT="$CODIGO"

          # 2. Generamos el payload JSON nativamente con Python
          python3 << 'EOF' > payload.json
          import json, os
          
          codigo = os.environ.get('CODIGO_CONTENT', '')
          
          prompt = f"""Eres un agente experto revisor de bugs para un proyecto C++/CUDA. Revisa este código buscando fallos como:
          1. Llamadas a API CUDA sin CUDA_CHECK
          2. Kernels sin guardia de borde (if (i >= N) return)
          3. Falta de cudaDeviceSynchronize() antes de host-read
          
          Código:
          {codigo}

          Responde en JSON exacto:
          {{
            "bugs": [
              {{
                "tipo": "mecanico" o "requiere_humano",
                "archivo": "nombre",
                "descripcion": "descripción",
                "fix_sugerido": "código de arreglo"
              }}
            ]
          }}"""

          payload = {
              "model": "gpt-4o-mini",
              "messages": [
                  {"role": "system", "content": "You are a helpful assistant designed to output JSON."},
                  {"role": "user", "content": prompt}
              ],
              "response_format": { "type": "json_object" },
              "temperature": 0.1
          }
          
          with open('payload.json', 'w') as f:
              json.dump(payload, f)
          EOF

          # 3. Llamada a GitHub Models usando el archivo payload seguro
          curl -s -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GH_MODELS_TOKEN" \
            -d @payload.json > api_response.json

          # 4. Procesamiento y Salvavidas
          python3 << 'EOF' > bugs.json
          import json, sys
          try:
              with open('api_response.json', 'r') as f:
                  data = json.load(f)
              
              if 'error' in data:
                  fallback = { "bugs": [] }
                  print(json.dumps(fallback))
                  sys.exit(0)
                  
              raw_text = data['choices'][0]['message']['content'].strip()
              
              if raw_text.startswith('```json\n'): raw_text = raw_text[8:]
              elif raw_text.startswith('```json'): raw_text = raw_text[7:]
              if raw_text.endswith('```'): raw_text = raw_text[:-3]
              
              json.loads(raw_text.strip())
              print(raw_text.strip())
              
          except Exception as e:
              fallback = { "bugs": [] }
              print(json.dumps(fallback))
          EOF

      - name: Crear issues para bugs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import json, subprocess
          with open('bugs.json') as f:
              resultado = json.load(f)
          for bug in resultado.get('bugs', []):
              tipo = bug.get('tipo', '')
              archivo = bug.get('archivo', 'desconocido')
              desc = bug.get('descripcion', '')
              fix = bug.get('fix_sugerido', '')
              
              labels = 'bug,agent,cuda' + (',agent:auto-fix' if tipo == 'mecanico' else '')
              prefijo = "[Agente] Bug mecánico" if tipo == 'mecanico' else "[Agente] Bug — requiere revisión humana"
              
              body = f"## Bug detectado por agente revisor (gpt-4o-mini)\n\n**Archivo:** `{archivo}`\n\n## Descripción\n{desc}\n\n## Fix sugerido\n```cpp\n{fix}\n```"
              subprocess.run(['gh', 'issue', 'create', '--title', f"{prefijo}: {desc[:55]}", '--body', body, '--label', labels])
          EOF