name: Agente revisor de bugs

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  revisor-bugs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Analizar código con Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          CODIGO=""
          for f in kernels/*.cu kernels/*.cuh CudaBuffer.h NBodySystem.cpp NBodySimulator.cpp; do
            if [ -f "$f" ]; then
              CODIGO="$CODIGO\n\n===$f ===\n$(head -80$f)"
            fi
          done
          
          if [ -z "$CODIGO" ]; then
            CODIGO="No se encontraron archivos CUDA aún."
          fi

          PROMPT="Eres un agente experto revisor de bugs para un proyecto C++/CUDA. Revisa este código buscando fallos como:
          1. Llamadas a API CUDA sin CUDA_CHECK
          2. Kernels sin guardia de borde (if (i >= N) return)
          3. Falta de cudaDeviceSynchronize() antes de host-read
          
          Código:
          $CODIGO

          Responde en JSON exacto:
          {
            \"bugs\": [
              {
                \"tipo\": \"mecanico\" o \"requiere_humano\",
                \"archivo\": \"nombre\",
                \"descripcion\": \"descripción\",
                \"fix_sugerido\": \"código de arreglo\"
              }
            ]
          }"

          # 1. Llamar a la API y guardar en archivo
          curl -s -X POST "[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{\"parts\":[{\"text\": $(echo "$PROMPT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}]}],
              \"generationConfig\": { \"responseMimeType\": \"application/json\" }
            }" > api_response.json

          # 2. Procesar con Python seguro
          python3 << 'EOF' > bugs.json
          import json, sys
          try:
              with open('api_response.json', 'r') as f:
                  data = json.load(f)
              
              if 'error' in data:
                  fallback = {"bugs": [{"tipo": "requiere_humano", "archivo": "GitHub Actions", "descripcion": f"Error API Gemini: {data['error'].get('message', 'Desconocido')}", "fix_sugerido": ""}]}
                  print(json.dumps(fallback))
                  sys.exit(0)
                  
              raw_text = data['candidates'][0]['content']['parts'][0]['text'].strip()
              
              if raw_text.startswith('```json\n'): raw_text = raw_text[8:]
              elif raw_text.startswith('```json'): raw_text = raw_text[7:]
              if raw_text.endswith('```'): raw_text = raw_text[:-3]
              
              json.loads(raw_text.strip())
              print(raw_text.strip())
              
          except Exception as e:
              fallback = {"bugs": [{"tipo": "requiere_humano", "archivo": "GitHub Actions", "descripcion": f"Fallo al procesar respuesta: {str(e)}", "fix_sugerido": ""}]}
              print(json.dumps(fallback))
          EOF